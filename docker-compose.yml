# Development setup: source is mounted and both servers reload on change.
services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --reload
    env_file: ./backend/.env
    environment:
      # Override any local paths in .env so data stays in the volume.
      DATABASE_URL: sqlite:////data/tutor.db
      CHATGPT_AUTH_DIR: /data/auth
      FRONTEND_URL: http://127.0.0.1:${FRONTEND_PORT:-3000}
    volumes:
      - tutor-data:/data
      - ./backend/app:/app/app
    # Loopback only: Sign in with ChatGPT allows only a loopback callback, which this port receives.
    ports:
      - "127.0.0.1:1455:8000"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      # Keep the image's Linux node_modules and the container's build cache off the host.
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

volumes:
  tutor-data:
