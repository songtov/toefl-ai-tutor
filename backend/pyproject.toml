[project]
name = "english-ai-tutor"
version = "0.1.0"
description = "AI English tutor that remembers learner weaknesses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.20.0",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
